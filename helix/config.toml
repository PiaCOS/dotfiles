theme = "default_but_better"

# Keybindings live in `init.scm` on this branch (steel plugin system port, see
# helix-editor/helix#8675 / mattwparas/helix `steel-event-system`).

[editor]
line-number = "relative"
bufferline = "never" # always, never, multiple
true-color = true
end-of-line-diagnostics = "error"
popup-border = "all"
trim-trailing-whitespace = true
rainbow-brackets = true
preview-completion-insert = false
clipboard-provider = "x-clip"


[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "disable"

[editor.cursor-shape]
normal = "block" # block, bar, underline, hidden
insert = "bar"
select = "underline"


[editor.statusline]
left = ["mode", "file-name", "spinner"]
center = ["position", "separator", "total-line-numbers", "spacer", "diagnostics"]
right = ["position-percentage", "file-type", "separator", "selections", "file-encoding"]
separator = "|"
mode.insert = "INSERT"
mode.normal = "NORMAL"
mode.select = "SELECT"


[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
# "'" = "'"
# '`' = '`'
'<' = '>'


[editor.whitespace.render]
space = "none"
# tab = "all"
tab = "none"
nbsp = "none"
nnbsp = "none"
newline = "none"


[editor.soft-wrap]
enable = true
max-wrap = 20
# max-indent-retain=0
wrap-indicator = ""

[editor.smart-tab]
enable = true
supersede-menu = true # :3


[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1
