theme = "default_but_better"

[keys.normal]
"X" = "extend_line_above"
"`" = ["move_char_right", "move_prev_word_start", "move_next_word_start", "search_selection"]
"C-m" = [":pipe scry", "collapse_selection"]
"C-p" = [
    ":pipe peek %{language} %{selection}",
    "collapse_selection",
]
"tab" = "jump_forward"
"S-tab" = "jump_backward"

[keys.normal.space.z]
"z" = "rotate_view"
"v" = "vsplit"
"s" = "hsplit"
"up" = "jump_view_up"
"down" = "jump_view_down"
"right" = "jump_view_right"
"left" = "jump_view_left"

[keys.normal.g]
"g" = "goto_word"
"G" = "goto_file_start"

[keys.select.g]
"g" = "goto_word"
"G" = "goto_file_start"

[keys.insert]
"j" = { "j" = "normal_mode" }

[keys.normal.space.B]
l = ":sh git blame -L %{cursor_line},+1 %{buffer_name}"
b = ":sh git blame -L %{selection_line_start},%{selection_line_end} %{buffer_name}"
L = [
    ":pipe-to sh -c 'commit_hash=$(git blame -L %{cursor_line},+1 --porcelain %{buffer_name} | head -n 1 | awk \"{print \\$1}\"); git show $commit_hash > /tmp/hx-git-show.diff'",
    ":open /tmp/hx-git-show.diff"
]


[editor]
line-number = "relative"
bufferline = "never" # always, never, multiple
true-color = true
end-of-line-diagnostics = "error"
popup-border = "all"
trim-trailing-whitespace = true
rainbow-brackets = true
preview-completion-insert = false
clipboard-provider = "x-clip"


[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "disable"

[editor.cursor-shape]
normal = "block" # block, bar, underline, hidden
insert = "bar"
select = "underline"


[editor.statusline]
left = ["mode", "file-name", "spinner"]
center = ["position", "separator", "total-line-numbers", "spacer", "diagnostics"]
right = ["position-percentage", "file-type", "separator", "selections", "file-encoding"]
separator = "|"
mode.insert = "INSERT"
mode.normal = "NORMAL"
mode.select = "SELECT"


[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
"'" = "'"
# '`' = '`'
'<' = '>'


[editor.whitespace.render]
space = "none"
# tab = "all"
tab = "none"
nbsp = "none"
nnbsp = "none"
newline = "none"


[editor.soft-wrap]
enable = true
max-wrap = 20
# max-indent-retain=0
wrap-indicator = ""

[editor.smart-tab]
enable = true
supersede-menu = true # :3


[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1
